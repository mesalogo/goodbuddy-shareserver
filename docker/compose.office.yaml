services:
  shareserver:
    environment:
      OFFICE_ENABLED: "true"
      OFFICE_DATA_DIR: /app/data/office
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set a fixed random secret of at least 32 characters}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8080}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      OFFICE_INTERNAL_URL: http://shareserver:8787
      # Community deployment keeps this off; enable only for a licensed White Label engine.
      OFFICE_WHITE_LABEL_ENABLED: ${OFFICE_WHITE_LABEL_ENABLED:-false}
      # Opt-in for our patched Community desktop UI, independent of DE licensing.
      OFFICE_CUSTOM_UI_ENABLED: ${OFFICE_CUSTOM_UI_ENABLED:-false}

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-goodbuddy/onlyoffice-server:10.0.0-169-ce9999}
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set a fixed random secret}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
    ports:
      - "${OFFICE_BIND_ADDRESS:-127.0.0.1}:${ONLYOFFICE_PORT:-8080}:80"
    volumes:
      - ${ONLYOFFICE_DATA_ROOT:-../data/onlyoffice-community}/logs:/var/log/onlyoffice
      - ${ONLYOFFICE_DATA_ROOT:-../data/onlyoffice-community}/data:/var/www/onlyoffice/Data
      - ${ONLYOFFICE_DATA_ROOT:-../data/onlyoffice-community}/lib:/var/lib/onlyoffice
      - ${ONLYOFFICE_DATA_ROOT:-../data/onlyoffice-community}/db:/var/lib/postgresql
    shm_size: 256mb
    restart: unless-stopped
